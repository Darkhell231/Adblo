name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Распаковать архив и собрать проект
        run: |
          unzip -q adblocker.zip
          flutter create --org com.example --project-name adblocker app
          cp adblocker/pubspec.yaml app/pubspec.yaml
          cp adblocker/lib/main.dart app/lib/main.dart
          K=app/android/app/src/main/kotlin/com/example/adblocker
          mkdir -p $K
          cp adblocker/android_files/kotlin/*.kt $K/
          cp adblocker/android_files/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml

      - name: Сборка APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: adblocker-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
